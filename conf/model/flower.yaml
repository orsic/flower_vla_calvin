# FLOWERVLA Configuration
_target_: flower.models.flower.FLOWERVLA
_recursive_: false

# VLM Configuration
vlm_path: microsoft/Florence-2-large
freeze_florence: False
freeze_vision_tower: False
vlm_prompt_style: default
token_dropout: 0.1  # Post-encoder unstructured token dropout (existing regularizer)

# Dirichlet modality-token dropout (pre-encoder physical removal, per-sample)
modality_dropout: False
modality_dropout_keep_fraction: 0.5
modality_dropout_alphas: [1.0, 1.0, 1.0]
# Proprio isn't a token (it's an AdaLN conditioning vector, not part of the Dirichlet budget
# above) — its own per-sample Bernoulli keep probability while modality_dropout=True.
modality_dropout_proprio_keep_p: 0.5

# Fixed modality ablation: which modalities this model observes. Any set to False has its
# tokens physically removed pre-encoder in every forward — training, validation and eval.
# Mutually exclusive with modality_dropout. At least one must stay True. proprio=False
# requires use_proprio=True (nothing to withhold otherwise).
modalities:
  rgb_static: true
  rgb_gripper: true
  language: true
  proprio: true

# Model Structure
multistep: ${multistep}
num_sampling_steps: 4
lowdim_obs_dim: ${proprio_dims}
action_dim: 7
act_window_size: 10

# pretraining stuff
load_pretrained: True
pretrained_model_path: /home/hk-project-sustainebot/ft4740/code/flower_vla_policy/logs/runs/2025-02-05/10-17-02/360000_model_weights.pt
action_expert_from_scratch: False
# /home/hk-project-sustainebot/ft4740/code/flower_vla/logs/runs/2025-02-19/11-15-41/200000_model_weights.pt
# /home/hk-project-sustainebot/ft4740/code/flower_vla_policy/logs/runs/2025-02-05/10-17-02/360000_model_weights.pt joint + delta pret
# Model flags
use_second_view: True
second_view_key: image_wrist
action_type_adaln: True
use_causal_attention: true
use_cross_attn: True
use_adaln_cond: false
use_readout_token: false
use_proprio: false
return_act_chunk: false

# DiT Configuration
sampling_type: uniform
dit_dim: 1024
n_heads: 16
n_layers: 18
attn_pdrop: 0.1
resid_pdrop: 0.1
mlp_pdrop: 0.1
lora_dim: 256          # adaLN down-projection width (all DiT blocks, unless overridden below)
mlp_hidden_dim: null    # null -> SwiGlu's default (4*dit_dim, rounded), i.e. 2816 at dit_dim=1024

# Action-expert capacity: the pretrained checkpoint only covers 12 DiT blocks; n_layers=18
# above means the remaining 6 are extra. See README.md "Action-expert capacity" for details.
pretrained_dit_layers: 12
extra_layer_init: random       # random | zero | copy (duplicate a pretrained block)
extra_layer_placement: append  # append | interleave
extra_layer_lora_dim: null      # null -> lora_dim
extra_layer_mlp_hidden_dim: null  # null -> mlp_hidden_dim

# RoPE Configuration
use_rope: true
use_nope: false
query_seq_len: 100
# The 12 pretrained DiT blocks' rope cos/sin buffers are persistent, so they load the
# checkpoint's own theta (1000.0) regardless of this value; only the extra blocks above
# actually use it. Set to 1000.0 so the extra blocks match the pretrained ones instead of
# silently diverging from them.
rope_theta: 1000.0

# Optimizer Configuration
optimizer_type: adamw

optimizer:
  _target_: torch.optim.AdamW
  transformer_weight_decay: 0.05
  learning_rate: 2e-5
  # Separate LRs for the action expert. null falls back to learning_rate (dit_learning_rate)
  # or dit_learning_rate (new_layer_learning_rate) -- i.e. today's single-LR behavior.
  # Pre-training used 1e-4 for the whole DiT vs 2e-5 for the VLM.
  dit_learning_rate: null
  new_layer_learning_rate: null
  betas: [0.9, 0.95]

# Learning Rate Scheduler
lr_scheduler:
  lr_scheduler:
    init_lr: 2e-5
    init_lr_scale: 0.1
    final_lr_scale: 0.5
    total_steps: 50000
    phase_ratio: "(0.05, 0.1, 0.85)"
    lr: 2e-5