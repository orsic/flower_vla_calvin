defaults:
  - annotations: new_playtable_validation
  - callbacks/rollout_lh/tasks@tasks: new_playtable_tasks

eval_cfg_overwrite:
  datamodule:
    datasets:
      lang_dataset:
        lang_folder: lang_annotations
  model:
    num_sampling_steps: ${num_sampling_steps}

# Training run dir (holding .hydra/config.yaml) and the checkpoint to evaluate, e.g.
# <run>/seed_42/saved_models/last.ckpt. Set by ./run.sh pipeline-calvin.
train_folder: ???
checkpoint: ???
device: 0


log_dir: /saves/eval_logs
dataset_path: /calvin_data/task_ABCD_D
num_videos: 0
debug: False

# W&B logging from inside the eval; ./run.sh pipeline-calvin uploads result.csv instead.
log_wandb: False
wandb_entity: orsic-university-of-zagreb-faculty-of-electrical-enginee

num_sequences: 1000
ep_len: 360
num_sampling_steps: 4
multistep: 10

# Per-subtask rows go to <train_folder>/eval_logs/<ckpt>/calvin_ABCD_D/result.csv
# (flower/evaluation/eval_records.py); csv_dir overrides that directory.
csv_dir: null
# Move an existing result.csv aside instead of merging into it.
reeval: False
# Each chain is seeded from (base_seed, chain, sequence index), independent of GPU sharding.
base_seed: 0
# Modalities fed to the model; a dropout-trained model is evaluated once per combo.
eval_modalities:
  rgb_static: True
  rgb_gripper: True
  language: True
  proprio: True
