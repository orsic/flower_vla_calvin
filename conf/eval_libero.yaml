eval_cfg_overwrite:
  datamodule:
    datasets:
      lang_dataset:
        lang_folder: lang_annotations
  model:
    num_sampling_steps: 4

task_embedding_format: clip
log_dir: /home/hk-project-sustainebot/ft4740/code/flower_vla_calvin/logs/
dataset_path: /home/hk-project-robolear/ft4740/code/calvin_d_old/dataset/task_D_D
train_folder: /home/hk-project-sustainebot/ft4740/code/flower_vla_calvin/logs/best_checkpoints/calvin_abcd/.hydra/config.yaml
checkpoint: /home/hk-project-sustainebot/ft4740/code/flower_vla_calvin/logs/best_checkpoints/calvin_abcd/seed_342/avg_seq_len=4.72.ckpt
device: 0
num_videos: 30
debug: False

log_wandb: True
wandb_entity: orsic-university-of-zagreb-faculty-of-electrical-enginee

num_sequences: 50
max_steps: 520
n_eval: 20
eval_batch_size: 10  # episodes per batch; each runs in a separate MuJoCo subprocess
env_start_method: spawn  # spawn (parallel, real subprocesses) | dummy (sequential, in-process)
cross_task_batching: false  # true = fill each batch with episodes from different tasks
num_sampling_steps: 4
multistep: 10

benchmark_name: libero_10 # [LIBERO_SPATIAL, LIBERO_OBJECT, LIBERO_GOAL, LIBERO_90, LIBERO_10]
task_category: null  # null = all tasks; LIBERO-Plus only: filter to one perturbation category

seed: 0  # base seed for per-episode rollout seeding (recorded in the result CSV)
eval_modalities:  # set any to false to physically drop that modality's tokens pre-encoder
  rgb_static: true
  rgb_gripper: true
  language: true
  proprio: true  # requires model.use_proprio=True; not a token, gated separately (see FLOWERVLA.eval_proprio_mask)
base_task: null  # keep only tasks whose eval_records.base_task_name matches -- on LIBERO-Plus,
                 # every perturbation variant of one original task (e.g. all its camera viewpoints)
max_tasks: null  # keep at most N tasks after task_category/base_task filtering, spread evenly
                 # across them (first and last included) rather than the first N -- a
                 # perturbation suite orders variants by parameter, so the first N cluster.
                 # Unlike rerun.max_episodes (recording only), these narrow the eval itself and
                 # so mark result.csv's task_category_filter non-empty.
csv_dir: null  # null -> <train_folder>/eval_logs/<checkpoint_name>/<libero_variant>_<suite>/
reeval: false  # set by eval_pipeline.py's `plan --reeval` -- rotate result.csv aside before writing, instead of merging into it

rerun:  # opt-in Rerun (.rrd) recording of rollouts -- see flower/evaluation/rerun_recorder.py
  enabled: false
  max_episodes: 10     # record the first N episodes in work order; two evals differing only
                       # in eval_modalities therefore record the identical episode set
  jpeg_quality: 40     # 1-100 for both camera views; lower = smaller file
  path: null           # null -> <log_dir>/rollouts.rrd
  combo_name: null     # null -> the '+'-joined present-modality combo, e.g. static+lang+proprio
                       # (the entity root; two arms become two branches under one cursor)
  frame_stride: null   # null -> max_steps; width of each episode's slot on the `frame`
                       # timeline, which is what keeps two arms episode-aligned
  recording_id: null   # null -> "<libero_variant>_<benchmark_name>"; two .rrd files sharing one
                       # recording id merge into a single recording when opened together
