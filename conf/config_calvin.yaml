defaults:
  - callbacks: calvin
  - datamodule: calvin
  - model: flower
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

# Container mount of CALVIN_DATA_DIR (vars.env); run ./run.sh extract-calvin once first.
root_data_dir: /calvin_data/task_ABCD_D
lang_folder: lang_clip_resnet50

log_dir: ./logs
slurm: false
seed: 242
device: 'cuda'
batch_size: 8 
# Global batch = batch_size x devices x accumulate_grad_batches; CALVIN's 32 is 8 x 4 x 1,
# or 8 x 2 x 2 on two GPUs.
accumulate_grad_batches: 1
# Optimizer updates per epoch. trainer.limit_train_batches counts micro-batches, so it is
# scaled by accumulate_grad_batches to keep 35 x 1000 updates (and the LR schedule/EMA).
updates_per_epoch: 1000
devices: 4
act_dim: 7
proprio_dims: 7
obs_dim: 512
goal_dim: 512
obs_seq_len: 1
act_seq_len: 10
multistep: 10 #${act_seq_len}
p_last_state: 0
gen_img_res: 112
max_epochs: 35
# Rollout eval is disabled; evaluation runs after training via ./run.sh pipeline-calvin.
rollout_lh_skip_epochs: ${max_epochs}
num_workers: 12
benchmark_name: calvin_d # calvin_abcd
use_extracted_rel_actions: true

trainer:
  devices: ${devices}
  precision: bf16-mixed
  max_epochs: ${max_epochs}
  sync_batchnorm: True
  accelerator: gpu
  strategy: "ddp" 
  accumulate_grad_batches: ${accumulate_grad_batches}
  limit_train_batches: ${mul:${updates_per_epoch},${accumulate_grad_batches}}
  limit_val_batches: 4

logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  save_dir: .
  name: logger
  group: mode
  log_model: false
  project: multimodal_florence
  entity: orsic-university-of-zagreb-faculty-of-electrical-enginee
  id: ???

hydra:
  run:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}_seed${seed}
  sweep:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - log_dir
          - datamodule.root_data_dir
          - trainer.gpus
          - datamodule.num_workers
          - trainer.limit_train_batches
          - trainer.limit_val_batches
